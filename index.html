<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Reservas Standby</title>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
        body { background: #f0f4f8; padding: 20px; max-width: 1100px; margin: 0 auto; font-size: 16px; line-height: 1.6; }
        
        .logo-container { text-align: center; margin-bottom: 20px; }
        .logo-container img { max-width: 180px; height: auto; }
        
        .tela-login { max-width: 420px; margin: 50px auto; background: white; padding: 35px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); }
        .tela-login h1 { text-align: center; color: #b91c1c; margin-bottom: 5px; font-size: 1.6rem; }
        .tela-login p.subtitulo { text-align: center; color: #6b7280; margin-bottom: 25px; }
        
        input, button { width: 100%; padding: 14px; margin: 8px 0; border: 2px solid #ddd; border-radius: 8px; font-size: 1rem; }
        input:focus { border-color: #b91c1c; outline: none; }
        
        button { background: #b91c1c; color: white; border: none; cursor: pointer; font-weight: bold; }
        button:hover { background: #991b1b; }
        
        .btn-sair { background: #4b5563; margin: 10px 0 25px; }
        .btn-sair:hover { background: #374151; }
        
        .erro { color: #dc2626; margin-top: 12px; display: none; text-align: center; font-weight: bold; }
        .aviso-data { color: #d97706; text-align: center; margin: 10px 0; font-weight: bold; display: none; }
        
        .cabecalho { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; padding-bottom: 15px; border-bottom: 2px solid #e5e7eb; flex-wrap: wrap; gap: 10px; }
        .usuario { color: #333; }
        .admin-tag { display: inline-block; background: #b91c1c; color: white; padding: 3px 10px; border-radius: 15px; font-size: 0.8rem; font-weight: bold; margin-left: 6px; }
        
        .abas { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
        .aba { padding: 10px 20px; background: #e5e7eb; border-radius: 8px; cursor: pointer; font-weight: bold; border: none; font-size: 0.95rem; }
        .aba.ativa { background: #b91c1c; color: white; }
        .aba:hover { background: #d1d5db; }
        
        /* CALENDÁRIO */
        .container-calendario { 
            background: white; 
            padding: 25px; 
            border-radius: 12px; 
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            max-width: 500px;
            margin: 0 auto;
        }
        .titulo-calendario { 
            text-align: center; 
            color: #b91c1c; 
            margin-bottom: 20px; 
            font-size: 1.1rem;
        }
        .navegacao-mes { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            margin-bottom: 15px;
        }
        .botao-mes { 
            background: #f3f4f6; 
            color: #333; 
            border: none; 
            width: 36px; 
            height: 36px; 
            border-radius: 50%; 
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
        }
        .botao-mes:hover { background: #e5e7eb; }
        .nome-mes { font-weight: bold; font-size: 1rem; }
        
        .dias-semana { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin-bottom: 8px; }
        .dia-semana { text-align: center; font-weight: bold; color: #6b7280; font-size: 0.85rem; padding: 8px; }
        
        .grade-dias { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
        .dia { 
            text-align: center; 
            padding: 12px 8px; 
            border-radius: 8px; 
            cursor: pointer; 
            font-size: 0.95rem;
            transition: all 0.2s;
        }
        .dia:hover { background: #fef2f2; color: #b91c1c; }
        .dia.vazio { cursor: default; background: transparent; }
        .dia.passado { color: #ccc; cursor: not-allowed; }
        .dia.ocupado { background: #fecaca; color: #b91c1c; font-weight: bold; }
        .dia.selecionado { 
            background: #b91c1c; 
            color: white; 
            font-weight: bold;
        }
        
        .data-selecionada-texto { 
            text-align: center; 
            margin-top: 18px; 
            font-weight: bold; 
            color: #b91c1c;
            font-size: 1rem;
        }
        .botao-confirmar { width: 100%; margin-top: 15px; padding: 14px; font-size: 1rem; }
        
        /* FORMULÁRIO */
        .container-dados {
            display: none;
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            max-width: 500px;
            margin: 0 auto;
        }
        .voltar {
            background: #6b7280;
            margin-bottom: 15px;
            max-width: 140px;
            padding: 10px;
            font-size: 0.9rem;
        }
        .voltar:hover { background: #4b5563; }
        
        .destaque-data {
            background: #fef2f2;
            color: #b91c1c;
            padding: 12px;
            border-radius: 8px;
            text-align: center;
            font-weight: bold;
            margin-bottom: 20px;
        }
        .sucesso {
            color: #16a34a;
            margin-top: 15px;
            display: none;
            font-weight: bold;
            text-align: center;
            padding: 12px;
            background: #f0fdf4;
            border-radius: 8px;
        }
        
        .lista-reservas { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
        .reserva-item { border-bottom: 1px solid #eee; padding: 18px 0; }
        .reserva-data { font-weight: bold; color: #b91c1c; margin-bottom: 5px; }
        .vazio { text-align: center; color: #888; padding: 40px 20px; }
    </style>
</head>
<body>
    <!-- TELA DE LOGIN -->
    <div class="tela-login" id="telaLogin">
        <div class="logo-container">
            <img src="standby_logo_perfil_menos_1mb.jpg" alt="Standby">
        </div>
        <h1>Standby</h1>
        <p class="subtitulo">Sistema de Reservas</p>
        <input type="email" id="emailLogin" placeholder="Digite seu e-mail">
        <input type="password" id="senhaLogin" placeholder="Digite sua senha">
        <button onclick="fazerLogin()">Entrar no Sistema</button>
        <p class="erro" id="erroLogin"></p>
    </div>

    <!-- CONTEÚDO PRINCIPAL -->
    <div id="conteudo" style="display:none;">
        <div class="cabecalho">
            <div class="usuario">
                <strong id="nomeUsuario"></strong>
                <span id="tagAdmin" class="admin-tag" style="display:none;">ADMINISTRADORA</span>
                <br>
                <small id="emailUsuario"></small>
            </div>
            <button class="btn-sair" onclick="sair()">Sair do Sistema</button>
        </div>

        <!-- ABAS -->
        <div class="abas">
            <button class="aba ativa" onclick="mostrarAba('cadastro')">➕ Nova Reserva</button>
            <button class="aba" onclick="mostrarAba('minhas')">📋 Minhas Reservas</button>
            <button class="aba" id="abaTodas" style="display:none;" onclick="mostrarAba('todas')">📊 Todas as Reservas</button>
        </div>

        <!-- ABA: NOVA RESERVA — CALENDÁRIO -->
        <div id="painelCadastro">
            
            <!-- PASSO 1 — CALENDÁRIO VISÍVEL -->
            <div id="blocoCalendario" class="container-calendario">
                <p class="titulo-calendario">Escolha a data da reserva</p>
                <p class="aviso-data" id="avisoDataOcupada">⚠️ Esta data já tem reserva!</p>
                
                <!-- Navegação com setas -->
                <div class="navegacao-mes">
                    <button class="botao-mes" onclick="mudarMes(-1)">◀</button>
                    <span class="nome-mes" id="nomeMesAno"></span>
                    <button class="botao-mes" onclick="mudarMes(1)">▶</button>
                </div>
                
                <!-- Dias da semana -->
                <div class="dias-semana">
                    <span class="dia-semana">D</span>
                    <span class="dia-semana">S</span>
                    <span class="dia-semana">T</span>
                    <span class="dia-semana">Q</span>
                    <span class="dia-semana">Q</span>
                    <span class="dia-semana">S</span>
                    <span class="dia-semana">S</span>
                </div>
                
                <!-- Os dias do mês -->
                <div class="grade-dias" id="gradeDias"></div>
                
                <!-- Data escolhida e botão -->
                <p class="data-selecionada-texto" id="dataEscolhidaTexto"></p>
                <button class="botao-confirmar" id="botaoConfirmarData" onclick="irParaDados()" style="display:none;">
                    Confirmar esta data
                </button>
            </div>

            <!-- PASSO 2 — FORMULÁRIO -->
            <div id="blocoDados" class="container-dados">
                <button class="voltar" onclick="voltarParaCalendario()">← Escolher outra data</button>
                
                <div class="destaque-data" id="dataConfirmada"></div>
                
                <input type="text" id="nomeReserva" placeholder="Nome do passeio ou do cliente">
                <input type="text" id="responsavel" placeholder="Nome do responsável + telefone">
                <input type="number" id="qtdPessoas" placeholder="Quantidade de pessoas" min="1">
                <input type="time" id="horaReserva">
                
                <button onclick="salvarReserva()">✅ Confirmar e Salvar</button>
                <p class="sucesso" id="mensagemSucesso">✅ Reserva cadastrada com sucesso!</p>
            </div>
        </div>

        <!-- ABA: MINHAS RESERVAS -->
        <div id="painelMinhas" style="display:none;" class="lista-reservas">
            <h3>Minhas Reservas</h3>
            <div id="listaMinhas"></div>
        </div>

        <!-- ABA: TODAS AS RESERVAS (só admin) -->
        <div id="painelTodas" style="display:none;" class="lista-reservas">
            <h3>Todas as Reservas do Sistema</h3>
            <div id="listaTodas"></div>
        </div>
    </div>
<script>
// ===== FIREBASE =====
const firebaseConfig = {
  apiKey: "AIzaSyDHsOIuNg7pEtTg_-bpzJ0QK8foSZseP04",
  authDomain: "reservas-standby.firebaseapp.com",
  databaseURL: "https://reservas-standby-default-rtdb.firebaseio.com",
  projectId: "reservas-standby",
  storageBucket: "reservas-standby.firebasestorage.app",
  messagingSenderId: "874813022024",
  appId: "1:874813022024:web:6219130574f0dd26fe5d7d"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.database();

let usuarioAtual = null;
let ehAdmin = false;
const emailAdmin = "standby.reservas@gmail.com";

// Variáveis do calendário
let dataAtual = new Date();
let dataSelecionada = null;
const hoje = new Date();
hoje.setHours(0, 0, 0, 0);

// Armazena todas as datas já reservadas
let datasReservadas = {};

// ===== CARREGAR TODAS AS DATAS RESERVADAS =====
function carregarDatasReservadas() {
    datasReservadas = {};
    db.ref('reservas').once('value').then((snapshot) => {
        snapshot.forEach((filho) => {
            const r = filho.val();
            const chave = `${r.data}_${r.hora}`;
            datasReservadas[chave] = true;
        });
        if (document.getElementById("gradeDias")) renderizarCalendario();
    });
}

// ===== RENDERIZAR CALENDÁRIO =====
function renderizarCalendario() {
    const ano = dataAtual.getFullYear();
    const mes = dataAtual.getMonth();
    
    // Nome do mês
    const nomesMeses = [
        "janeiro", "fevereiro", "março", "abril", "maio", "junho",
        "julho", "agosto", "setembro", "outubro", "novembro", "dezembro"
    ];
    document.getElementById("nomeMesAno").textContent = `${nomesMeses[mes]} de ${ano}`;
    
    // Primeiro dia do mês (0=domingo)
    const primeiroDia = new Date(ano, mes, 1).getDay();
    // Último dia do mês
    const ultimoDia = new Date(ano, mes + 1, 0).getDate();
    
    const grade = document.getElementById("gradeDias");
    grade.innerHTML = "";
    
    // Dias vazios antes do primeiro dia
    for (let i = 0; i < primeiroDia; i++) {
        grade.innerHTML += `<div class="dia vazio"></div>`;
    }
    
    // Dias do mês
    for (let dia = 1; dia <= ultimoDia; dia++) {
        const dataDia = new Date(ano, mes, dia);
        const ehPassado = dataDia < hoje;
        
        // Verifica se tem alguma reserva nesta data
        const dataStr = `${ano}-${String(mes+1).padStart(2,'0')}-${String(dia).padStart(2,'0')}`;
        const temReserva = Object.keys(datasReservadas).some(k => k.startsWith(dataStr));
        
        const ehSelecionada = dataSelecionada && 
            dataSelecionada.getDate() === dia && 
            dataSelecionada.getMonth() === mes && 
            dataSelecionada.getFullYear() === ano;
        
        let classes = "dia";
        if (ehPassado) classes += " passado";
        else if (temReserva) classes += " ocupado";
        if (ehSelecionada) classes += " selecionado";
        
        const onclick = ehPassado ? "" : `onclick="escolherDia(${ano}, ${mes}, ${dia})"`;
        
        grade.innerHTML += `<div class="${classes}" ${onclick}>${dia}</div>`;
    }
}

// ===== MUDAR MÊS COM AS SETAS =====
function mudarMes(diferenca) {
    dataAtual.setMonth(dataAtual.getMonth() + diferenca);
    renderizarCalendario();
}

// ===== ESCOLHER UM DIA =====
function escolherDia(ano, mes, dia) {
    dataSelecionada = new Date(ano, mes, dia);
    
    const dataStr = `${ano}-${String(mes+1).padStart(2,'0')}-${String(dia).padStart(2,'0')}`;
    const jaTemReserva = Object.keys(datasReservadas).some(k => k.startsWith(dataStr));
    
    // Mostra aviso se já tem reserva
    const aviso = document.getElementById("avisoDataOcupada");
    if (jaTemReserva) {
        aviso.style.display = "block";
    } else {
        aviso.style.display = "none";
    }
    
    renderizarCalendario();
    
    // Mostra data escolhida e botão
    const diaF = String(dia).padStart(2, '0');
    const mesF = String(mes + 1).padStart(2, '0');
    document.getElementById("dataEscolhidaTexto").textContent = `${diaF}/${mesF}/${ano}`;
    document.getElementById("botaoConfirmarData").style.display = "block";
}

// ===== IR PARA FORMULÁRIO =====
function irParaDados() {
    if (!dataSelecionada) return;
    
    const dia = String(dataSelecionada.getDate()).padStart(2, '0');
    const mes = String(dataSelecionada.getMonth() + 1).padStart(2, '0');
    const ano = dataSelecionada.getFullYear();
    const dataStr = `${ano}-${String(mes).padStart(2,'0')}-${String(dia).padStart(2,'0')}`;
    
    // Verifica novamente antes de avançar
    const jaTemReserva = Object.keys(datasReservadas).some(k => k.startsWith(dataStr));
    if (jaTemReserva) {
        alert("⚠️ Esta data já tem reserva cadastrada! Escolha outra data.");
        return;
    }
    
    document.getElementById("dataConfirmada").textContent = `${dia}/${mes}/${ano}`;
    document.getElementById("blocoCalendario").style.display = "none";
    document.getElementById("blocoDados").style.display = "block";
}

// ===== VOLTAR PARA CALENDÁRIO =====
function voltarParaCalendario() {
    document.getElementById("blocoDados").style.display = "none";
    document.getElementById("blocoCalendario").style.display = "block";
    
    // Limpa os campos
    document.getElementById("nomeReserva").value = "";
    document.getElementById("responsavel").value = "";
    document.getElementById("qtdPessoas").value = "";
    document.getElementById("horaReserva").value = "";
    document.getElementById("mensagemSucesso").style.display = "none";
    document.getElementById("avisoDataOcupada").style.display = "none";
}

// ===== LOGIN =====
function fazerLogin() {
    const email = document.getElementById("emailLogin").value.trim();
    const senha = document.getElementById("senhaLogin").value;
    const erro = document.getElementById("erroLogin");
    
    if (!email || !senha) {
        erro.textContent = "⚠️ Preencha e-mail e senha!";
        erro.style.display = "block";
        return;
    }
    
    auth.signInWithEmailAndPassword(email, senha)
    .then(() => erro.style.display = "none")
    .catch((e) => {
        switch(e.code) {
            case "auth/user-not-found": erro.textContent = "❌ E-mail não encontrado!"; break;
            case "auth/wrong-password": erro.textContent = "❌ Senha incorreta!"; break;
            default: erro.textContent = "❌ Erro ao entrar. Confira os dados.";
        }
        erro.style.display = "block";
    });
}

// ===== VERIFICAR LOGADO =====
auth.onAuthStateChanged((usuario) => {
    if (usuario) {
        usuarioAtual = usuario;
        ehAdmin = (usuario.email === emailAdmin);
        
        document.getElementById("telaLogin").style.display = "none";
        document.getElementById("conteudo").style.display = "block";
        document.getElementById("nomeUsuario").textContent = usuario.displayName || usuario.email.split("@")[0];
        document.getElementById("emailUsuario").textContent = usuario.email;
        
        if (ehAdmin) {
            document.getElementById("tagAdmin").style.display = "inline-block";
            document.getElementById("abaTodas").style.display = "block";
        }
        
        // Carrega datas ocupadas e inicializa calendário
        carregarDatasReservadas();
        dataAtual = new Date();
        dataSelecionada = null;
        
        carregarMinhas();
        if (ehAdmin) carregarTodas();
    } else {
        usuarioAtual = null;
        document.getElementById("telaLogin").style.display = "block";
        document.getElementById("conteudo").style.display = "none";
    }
});

// ===== SAIR =====
function sair() {
    auth.signOut();
}
// ===== TROCAR ABA =====
function mostrarAba(nome) {
    document.querySelectorAll('.aba').forEach(a => a.classList.remove('ativa'));
    document.getElementById('painelCadastro').style.display = 'none';
    document.getElementById('painelMinhas').style.display = 'none';
    document.getElementById('painelTodas').style.display = 'none';
    
    if (nome === 'cadastro') {
        document.querySelectorAll('.aba')[0].classList.add('ativa');
        document.getElementById('painelCadastro').style.display = 'block';
        voltarParaCalendario();
        dataSelecionada = null;
        document.getElementById("dataEscolhidaTexto").textContent = "";
        document.getElementById("botaoConfirmarData").style.display = "none";
        renderizarCalendario();
    } else if (nome === 'minhas') {
        document.querySelectorAll('.aba')[1].classList.add('ativa');
        document.getElementById('painelMinhas').style.display = 'block';
        carregarMinhas();
    } else if (nome === 'todas' && ehAdmin) {
        document.querySelectorAll('.aba')[2].classList.add('ativa');
        document.getElementById('painelTodas').style.display = 'block';
        carregarTodas();
    }
}

// ===== SALVAR RESERVA — SOMENTE APÓS PREENCHER TUDO =====
function salvarReserva() {
    if (!dataSelecionada) {
        alert("Escolha uma data primeiro!");
        return;
    }
    
    // Pegar valores dos campos
    const nome = document.getElementById('nomeReserva').value.trim();
    const responsavel = document.getElementById('responsavel').value.trim();
    const quantidade = document.getElementById('qtdPessoas').value;
    const hora = document.getElementById('horaReserva').value;
    
    // ⚠️ VERIFICA SE TUDO FOI PREENCHIDO ANTES DE SALVAR
    if (!nome) {
        alert("⚠️ Digite o nome do passeio ou cliente!");
        document.getElementById('nomeReserva').focus();
        return;
    }
    if (!responsavel) {
        alert("⚠️ Digite o nome do responsável + telefone!");
        document.getElementById('responsavel').focus();
        return;
    }
    if (!quantidade || quantidade < 1) {
        alert("⚠️ Digite a quantidade de pessoas!");
        document.getElementById('qtdPessoas').focus();
        return;
    }
    if (!hora) {
        alert("⚠️ Escolha o horário da reserva!");
        document.getElementById('horaReserva').focus();
        return;
    }
    
    // Formatar data
    const ano = dataSelecionada.getFullYear();
    const mes = String(dataSelecionada.getMonth() + 1).padStart(2, '0');
    const dia = String(dataSelecionada.getDate()).padStart(2, '0');
    const dataFormatada = `${ano}-${mes}-${dia}`;
    
    // BLOQUEIO: Verificar se já existe reserva na MESMA DATA E HORA
    const chaveVerificar = `${dataFormatada}_${hora}`;
    if (datasReservadas[chaveVerificar]) {
        alert("⚠️ Já existe uma reserva nesta data e horário! Escolha outro horário.");
        return;
    }
    
    // Salvar no Firebase
    db.ref('reservas').push({
        data: dataFormatada,
        nome: nome,
        responsavel: responsavel,
        quantidade: quantidade,
        hora: hora,
        usuarioEmail: usuarioAtual.email,
        usuarioUid: usuarioAtual.uid,
        dataCadastro: new Date().toISOString()
    })
    .then(() => {
        // Adicionar à lista local de datas ocupadas
        datasReservadas[chaveVerificar] = true;
        
        // Mostrar mensagem de sucesso
        document.getElementById('mensagemSucesso').style.display = 'block';
        
        // Limpar e voltar após 3 segundos
        setTimeout(() => {
            document.getElementById('mensagemSucesso').style.display = 'none';
            voltarParaCalendario();
            dataSelecionada = null;
            document.getElementById("dataEscolhidaTexto").textContent = "";
            document.getElementById("botaoConfirmarData").style.display = "none";
            renderizarCalendario();
        }, 3000);
    })
    .catch((erro) => {
        alert("❌ Erro ao salvar: " + erro.message);
    });
}

// ===== CARREGAR SOMENTE AS RESERVAS DO USUÁRIO LOGADO =====
function carregarMinhas() {
    const lista = document.getElementById('listaMinhas');
    lista.innerHTML = '<p style="text-align:center; color:#888;">Carregando...</p>';
    
    db.ref('reservas')
        .orderByChild('usuarioUid')
        .equalTo(usuarioAtual.uid) // ← SÓ TRAZ AS DESTE USUÁRIO
        .once('value')
        .then((snapshot) => {
            lista.innerHTML = '';
            if (!snapshot.exists()) {
                lista.innerHTML = '<p class="vazio">Você ainda não cadastrou nenhuma reserva.</p>';
                return;
            }
            
            const reservas = [];
            snapshot.forEach((filho) => {
                reservas.push({ id: filho.key, ...filho.val() });
            });
            
            // Ordenar da mais nova para a mais antiga
            reservas.sort((a, b) => b.data.localeCompare(a.data));
            
            // Exibir
            reservas.forEach((r) => {
                const [ano, mes, dia] = r.data.split('-');
                lista.innerHTML += `
                    <div class="reserva-item">
                        <p class="reserva-data">📅 ${dia}/${mes}/${ano} — ${r.hora}</p>
                        <p><strong>Cliente/Passeio:</strong> ${r.nome}</p>
                        <p><strong>Responsável:</strong> ${r.responsavel}</p>
                        <p><strong>Pessoas:</strong> ${r.quantidade}</p>
                    </div>
                `;
            });
        })
        .catch((erro) => {
            lista.innerHTML = '<p style="color:red; text-align:center;">Erro ao carregar reservas.</p>';
        });
}

// ===== CARREGAR TODAS AS RESERVAS — SÓ ADMIN =====
function carregarTodas() {
    const lista = document.getElementById('listaTodas');
    lista.innerHTML = '<p style="text-align:center; color:#888;">Carregando...</p>';
    
    db.ref('reservas')
        .orderByChild('data')
        .limitToLast(100)
        .once('value')
        .then((snapshot) => {
            lista.innerHTML = '';
            if (!snapshot.exists()) {
                lista.innerHTML = '<p class="vazio">Nenhuma reserva cadastrada ainda.</p>';
                return;
            }
            
            const reservas = [];
            snapshot.forEach((filho) => {
                reservas.push({ id: filho.key, ...filho.val() });
            });
            
            reservas.sort((a, b) => b.data.localeCompare(a.data));
            
            reservas.forEach((r) => {
                const [ano, mes, dia] = r.data.split('-');
                lista.innerHTML += `
                    <div class="reserva-item">
                        <p class="reserva-data">📅 ${dia}/${mes}/${ano} — ${r.hora}</p>
                        <p><strong>Cliente/Passeio:</strong> ${r.nome}</p>
                        <p><strong>Responsável:</strong> ${r.responsavel}</p>
                        <p><strong>Pessoas:</strong> ${r.quantidade}</p>
                        <p style="color:#666; font-size:0.9rem; margin-top:4px;">👤 Cadastrado por: ${r.usuarioEmail}</p>
                    </div>
                `;
            });
        });
}
</script>
