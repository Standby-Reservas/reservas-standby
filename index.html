<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Reservas Standby</title>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
        body { background: #f0f4f8; padding: 20px; max-width: 1200px; margin: 0 auto; font-size: 18px; line-height: 1.6; }
        
        .logo-container { text-align: center; margin-bottom: 20px; }
        .logo-container img { max-width: 200px; height: auto; }
        
        .tela-login { max-width: 450px; margin: 60px auto; background: white; padding: 40px; border-radius: 15px; box-shadow: 0 8px 30px rgba(0,0,0,0.15); }
        .tela-login h1 { text-align: center; color: #b91c1c; margin-bottom: 5px; font-size: 2rem; }
        .tela-login p.subtitulo { text-align: center; color: #6b7280; margin-bottom: 30px; }
        
        input, button { width: 100%; padding: 15px; margin: 10px 0; border: 2px solid #ddd; border-radius: 10px; font-size: 1.05rem; }
        input:focus { border-color: #b91c1c; outline: none; box-shadow: 0 0 0 3px rgba(185,28,28,0.15); }
        
        button { background: #b91c1c; color: white; border: none; cursor: pointer; font-weight: bold; font-size: 1.1rem; }
        button:hover { background: #991b1b; }
        
        .btn-sair { background: #4b5563; margin: 10px 0 30px; }
        .btn-sair:hover { background: #374151; }
        
        .erro { color: #dc2626; margin-top: 15px; display: none; text-align: center; font-weight: bold; }
        
        .cabecalho { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; padding-bottom: 15px; border-bottom: 2px solid #ddd; }
        .usuario { color: #333; }
        .admin-tag { display: inline-block; background: #b91c1c; color: white; padding: 4px 12px; border-radius: 20px; font-size: 0.85rem; font-weight: bold; margin-left: 8px; }
        
        .abas { display: flex; gap: 10px; margin-bottom: 25px; flex-wrap: wrap; }
        .aba { padding: 12px 24px; background: #e5e7eb; border-radius: 10px; cursor: pointer; font-weight: bold; border: none; }
        .aba.ativa { background: #b91c1c; color: white; }
        .aba:hover { background: #d1d5db; }
        
        /* TELA DA DATA — GRANDE E CENTRALIZADA */
        .tela-data-grande { 
            text-align: center; 
            padding: 40px 20px; 
            background: white; 
            border-radius: 15px; 
            box-shadow: 0 6px 20px rgba(0,0,0,0.08);
            min-height: 500px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .tela-data-grande h2 { color: #b91c1c; margin-bottom: 40px; font-size: 1.6rem; }
        .tela-data-grande input[type="date"] {
            font-size: 1.8rem;
            padding: 30px;
            width: 100%;
            max-width: 450px;
            text-align: center;
            border: 3px solid #b91c1c;
            border-radius: 12px;
            cursor: pointer;
            background: #fff;
        }
        .botao-confirmar-data { max-width: 450px; margin-top: 30px; font-size: 1.2rem; padding: 18px; }
        
        /* TELA DE DADOS */
        .tela-dados { display: none; background: white; padding: 35px; border-radius: 15px; box-shadow: 0 6px 20px rgba(0,0,0,0.08); }
        .data-escolhida { background: #fef2f2; color: #b91c1c; font-weight: bold; font-size: 1.3rem; padding: 20px; border-radius: 10px; margin-bottom: 30px; text-align: center; }
        .botao-voltar { background: #6b7280; margin-bottom: 20px; max-width: 200px; font-size: 1rem; padding: 12px; }
        .botao-voltar:hover { background: #4b5563; }
        
        .sucesso { color: #16a34a; margin-top: 20px; display: none; font-weight: bold; font-size: 1.1rem; text-align: center; padding: 15px; background: #f0fdf4; border-radius: 10px; }
        
        .lista-reservas { background: white; padding: 30px; border-radius: 15px; box-shadow: 0 6px 20px rgba(0,0,0,0.08); }
        .reserva-item { border-bottom: 1px solid #eee; padding: 20px 0; }
        .reserva-nome { font-weight: bold; color: #b91c1c; font-size: 1.1rem; margin-bottom: 8px; }
        .reserva-dados { color: #444; margin: 5px 0; }
        .vazio { text-align: center; color: #888; padding: 50px 20px; }
    </style>
</head>
<body>
    <!-- TELA DE LOGIN -->
    <div class="tela-login" id="telaLogin">
        <div class="logo-container">
            <img src="standby_logo_perfil_menos_1mb.jpg" alt="Standby">
        </div>
        <h1>Standby</h1>
        <p class="subtitulo">Sistema de Reservas</p>
        <input type="email" id="emailLogin" placeholder="Digite seu e-mail">
        <input type="password" id="senhaLogin" placeholder="Digite sua senha">
        <button onclick="fazerLogin()">Entrar no Sistema</button>
        <p class="erro" id="erroLogin"></p>
    </div>

    <!-- CONTEÚDO PRINCIPAL — SÓ APARECE QUANDO LOGADO -->
    <div id="conteudo" style="display:none;">
        <div class="cabecalho">
            <div class="usuario">
                <strong id="nomeUsuario"></strong>
                <span id="tagAdmin" class="admin-tag" style="display:none;">ADMINISTRADORA</span>
                <br>
                <small id="emailUsuario"></small>
            </div>
            <button class="btn-sair" onclick="sair()">Sair do Sistema</button>
        </div>

        <!-- ABAS -->
        <div class="abas">
            <button class="aba ativa" onclick="mostrarAba('cadastro')">➕ Nova Reserva</button>
            <button class="aba" onclick="mostrarAba('minhas')">📋 Minhas Reservas</button>
            <button class="aba" id="abaTodas" style="display:none;" onclick="mostrarAba('todas')">📊 Todas as Reservas</button>
        </div>

        <!-- ABA: NOVA RESERVA -->
        <div id="painelCadastro">
            
            <!-- PASSO 1 — CALENDÁRIO GRANDE NA TELA TODA -->
            <div id="passoData" class="tela-data-grande">
                <h2>📅 Escolha a data da reserva</h2>
                <input type="date" id="dataReserva">
                <button class="botao-confirmar-data" onclick="avancarDados()">✅ Confirmar esta data</button>
            </div>

            <!-- PASSO 2 — DADOS — APARECE DEPOIS DE ESCOLHER A DATA -->
            <div id="passoDados" class="tela-dados">
                <button class="botao-voltar" onclick="voltarEscolherData()">← Escolher outra data</button>
                
                <div class="data-escolhida">
                    📅 Data escolhida: <span id="dataEscolhida"></span>
                </div>
                
                <input type="text" id="nomeReserva" placeholder="Nome do passeio ou do cliente">
                <input type="text" id="responsavel" placeholder="Nome do responsável + telefone">
                <input type="number" id="qtdPessoas" placeholder="Quantidade de pessoas" min="1">
                <input type="time" id="horaReserva">
                
                <button onclick="salvarReserva()">✅ CONFIRMAR E SALVAR</button>
                <p class="sucesso" id="mensagemSucesso">✅ Reserva cadastrada com sucesso!</p>
            </div>
        </div>

        <!-- ABA: MINHAS RESERVAS -->
        <div id="painelMinhas" style="display:none;" class="lista-reservas">
            <h3>Suas reservas</h3>
            <div id="listaMinhas"></div>
        </div>

        <!-- ABA: TODAS AS RESERVAS -->
        <div id="painelTodas" style="display:none;" class="lista-reservas">
            <h3>Todas as reservas do sistema</h3>
            <div id="listaTodas"></div>
        </div>
    </div>
<script>
// ===== CONFIGURAÇÃO DO FIREBASE =====
const firebaseConfig = {
  apiKey: "AIzaSyDHsOIuNg7pEtTg_-bpzJ0QK8foSZseP04",
  authDomain: "reservas-standby.firebaseapp.com",
  databaseURL: "https://reservas-standby-default-rtdb.firebaseio.com",
  projectId: "reservas-standby",
  storageBucket: "reservas-standby.firebasestorage.app",
  messagingSenderId: "874813022024",
  appId: "1:874813022024:web:6219130574f0dd26fe5d7d"
};

// Inicializa
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.database();

let usuarioAtual = null;
let ehAdmin = false;
const emailAdmin = "standby.reservas@gmail.com";

// Bloqueia datas passadas
const hoje = new Date().toISOString().split('T')[0];
document.addEventListener('DOMContentLoaded', () => {
    const campoData = document.getElementById('dataReserva');
    if (campoData) campoData.setAttribute('min', hoje);
});

// ===== FAZER LOGIN =====
function fazerLogin() {
    const email = document.getElementById('emailLogin').value.trim();
    const senha = document.getElementById('senhaLogin').value;
    const erro = document.getElementById('erroLogin');
    
    if (!email || !senha) {
        erro.textContent = '⚠️ Preencha e-mail e senha!';
        erro.style.display = 'block';
        return;
    }
    
    auth.signInWithEmailAndPassword(email, senha)
    .then(() => {
        erro.style.display = 'none';
    })
    .catch((erro) => {
        console.log('Erro:', erro.code);
        switch(erro.code) {
            case 'auth/user-not-found':
                erro.textContent = '❌ E-mail não encontrado!';
                break;
            case 'auth/wrong-password':
                erro.textContent = '❌ Senha incorreta!';
                break;
            case 'auth/invalid-email':
                erro.textContent = '❌ Formato de e-mail inválido!';
                break;
            default:
                erro.textContent = '❌ Erro ao entrar. Confira os dados.';
        }
        erro.style.display = 'block';
    });
}

// ===== VERIFICAR SE ESTÁ LOGADO =====
auth.onAuthStateChanged((usuario) => {
    if (usuario) {
        usuarioAtual = usuario;
        ehAdmin = (usuario.email === emailAdmin);
        
        // Mostra conteúdo, esconde login
        document.getElementById('telaLogin').style.display = 'none';
        document.getElementById('conteudo').style.display = 'block';
        
        // Dados do usuário
        document.getElementById('nomeUsuario').textContent = usuario.displayName || usuario.email.split('@')[0];
        document.getElementById('emailUsuario').textContent = usuario.email;
        
        // Mostra aba de admin se for você
        if (ehAdmin) {
            document.getElementById('tagAdmin').style.display = 'inline-block';
            document.getElementById('abaTodas').style.display = 'block';
        }
        
        carregarMinhas();
        if (ehAdmin) carregarTodas();
    } else {
        usuarioAtual = null;
        document.getElementById('telaLogin').style.display = 'block';
        document.getElementById('conteudo').style.display = 'none';
    }
});

// ===== SAIR DO SISTEMA =====
function sair() {
    auth.signOut();
    voltarEscolherData();
}

// ===== AVANÇAR PARA PREENCHER DADOS =====
function avancarDados() {
    const data = document.getElementById('dataReserva').value;
    if (!data) {
        alert('⚠️ Escolha uma data primeiro!');
        return;
    }
    const [ano, mes, dia] = data.split('-');
    document.getElementById('dataEscolhida').textContent = `${dia}/${mes}/${ano}`;
    
    document.getElementById('passoData').style.display = 'none';
    document.getElementById('passoDados').style.display = 'block';
}

// ===== VOLTAR PARA ESCOLHER DATA =====
function voltarEscolherData() {
    document.getElementById('passoDados').style.display = 'none';
    document.getElementById('passoData').style.display = 'flex';
    
    // Limpa os campos
    document.getElementById('nomeReserva').value = '';
    document.getElementById('responsavel').value = '';
    document.getElementById('qtdPessoas').value = '';
    document.getElementById('horaReserva').value = '';
    document.getElementById('mensagemSucesso').style.display = 'none';
}

// ===== TROCAR DE ABA =====
function mostrarAba(nome) {
    document.querySelectorAll('.aba').forEach(a => a.classList.remove('ativa'));
    document.getElementById('painelCadastro').style.display = 'none';
    document.getElementById('painelMinhas').style.display = 'none';
    document.getElementById('painelTodas').style.display = 'none';
    
    if (nome === 'cadastro') {
        document.querySelectorAll('.aba')[0].classList.add('ativa');
        document.getElementById('painelCadastro').style.display = 'block';
        voltarEscolherData();
    } else if (nome === 'minhas') {
        document.querySelectorAll('.aba')[1].classList.add('ativa');
        document.getElementById('painelMinhas').style.display = 'block';
        carregarMinhas();
    } else if (nome === 'todas' && ehAdmin) {
        document.querySelectorAll('.aba')[2].classList.add('ativa');
        document.getElementById('painelTodas').style.display = 'block';
        carregarTodas();
    }
}
// ===== SALVAR RESERVA NO BANCO =====
function salvarReserva() {
    const data = document.getElementById('dataReserva').value;
    const nome = document.getElementById('nomeReserva').value.trim();
    const responsavel = document.getElementById('responsavel').value.trim();
    const quantidade = document.getElementById('qtdPessoas').value;
    const hora = document.getElementById('horaReserva').value;
    
    if (!nome || !responsavel || !quantidade || !hora) {
        alert('⚠️ Preencha TODOS os campos antes de confirmar!');
        return;
    }
    
    db.ref('reservas').push({
        data,
        nome,
        responsavel,
        quantidade,
        hora,
        usuarioEmail: usuarioAtual.email,
        usuarioUid: usuarioAtual.uid,
        dataCadastro: new Date().toISOString()
    })
    .then(() => {
        document.getElementById('mensagemSucesso').style.display = 'block';
        setTimeout(() => {
            document.getElementById('mensagemSucesso').style.display = 'none';
            voltarEscolherData();
        }, 3000);
    })
    .catch((erro) => {
        alert('❌ Erro ao salvar: ' + erro.message);
    });
}

// ===== CARREGAR APENAS AS MINHAS RESERVAS =====
function carregarMinhas() {
    const lista = document.getElementById('listaMinhas');
    lista.innerHTML = '<p style="text-align:center; color:#888;">Carregando...</p>';
    
    db.ref('reservas')
        .orderByChild('usuarioUid')
        .equalTo(usuarioAtual.uid)
        .once('value')
        .then((snapshot) => {
            lista.innerHTML = '';
            if (!snapshot.exists()) {
                lista.innerHTML = '<p class="vazio">Você ainda não cadastrou nenhuma reserva.</p>';
                return;
            }
            
            const reservas = [];
            snapshot.forEach((filho) => {
                reservas.push({ id: filho.key, ...filho.val() });
            });
            
            reservas.sort((a, b) => b.data.localeCompare(a.data));
            
            reservas.forEach((r) => {
                const [ano, mes, dia] = r.data.split('-');
                lista.innerHTML += `
                    <div class="reserva-item">
                        <p class="reserva-nome">📅 ${dia}/${mes}/${ano} — ${r.hora}</p>
                        <p class="reserva-dados"><strong>Cliente/Passeio:</strong> ${r.nome}</p>
                        <p class="reserva-dados"><strong>Responsável:</strong> ${r.responsavel}</p>
                        <p class="reserva-dados"><strong>Quantidade de pessoas:</strong> ${r.quantidade}</p>
                    </div>
                `;
            });
        });
}

// ===== CARREGAR TODAS AS RESERVAS (SÓ ADMIN) =====
function carregarTodas() {
    const lista = document.getElementById('listaTodas');
    lista.innerHTML = '<p style="text-align:center; color:#888;">Carregando...</p>';
    
    db.ref('reservas')
        .orderByChild('data')
        .limitToLast(100)
        .once('value')
        .then((snapshot) => {
            lista.innerHTML = '';
            if (!snapshot.exists()) {
                lista.innerHTML = '<p class="vazio">Nenhuma reserva cadastrada ainda.</p>';
                return;
            }
            
            const reservas = [];
            snapshot.forEach((filho) => {
                reservas.push({ id: filho.key, ...filho.val() });
            });
            
            reservas.sort((a, b) => b.data.localeCompare(a.data));
            
            reservas.forEach((r) => {
                const [ano, mes, dia] = r.data.split('-');
                lista.innerHTML += `
                    <div class="reserva-item">
                        <p class="reserva-nome">📅 ${dia}/${mes}/${ano} — ${r.hora}</p>
                        <p class="reserva-dados"><strong>Cliente/Passeio:</strong> ${r.nome}</p>
                        <p class="reserva-dados"><strong>Responsável:</strong> ${r.responsavel}</p>
                        <p class="reserva-dados"><strong>Quantidade de pessoas:</strong> ${r.quantidade}</p>
                        <p class="reserva-dados" style="color:#666; font-size:0.9rem;">👤 Cadastrado por: ${r.usuarioEmail}</p>
                    </div>
                `;
            });
        });
}
</script>

</body>
</html>
